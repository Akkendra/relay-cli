name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Node (package.json engines) and current Node on Linux; macOS is the tested platform.
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 26 }
          - { os: macos-latest, node: 26 }
    steps:
      # Actions are pinned to commit SHAs; Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Providers are fake executables in the tests; no Codex or Claude tokens are spent.
      - run: npm test
      - run: npm run build:dashboard
      - run: npm audit --audit-level=high
